name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff 需要完整提交历史

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build
        env:
          LOTUS_VERSION: ${{ github.ref_name }}

      # 哪吒面板「前端管理」(v2.5.0+) 要求:附件名为 dist.zip,
      # 所有条目位于 dist/ 下,且包含非空 dist/index.html
      - name: Package dist
        run: zip -r dist.zip dist

      - name: Verify package layout
        run: |
          entries=$(zipinfo -1 dist.zip)
          if echo "$entries" | grep -v '^dist/'; then
            echo "::error::dist.zip 中存在 dist/ 以外的条目"
            exit 1
          fi
          if ! echo "$entries" | grep -qx 'dist/index.html'; then
            echo "::error::dist.zip 缺少 dist/index.html"
            exit 1
          fi
          test -s dist/index.html

      # 按 conventional commits 自动分组生成本次 tag 的更新说明
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          body_path: CHANGELOG.md
          # 带连字符的 tag(如 v1.2.0-rc.1)标为预发布,
          # 面板「前端管理」会明确标记,避免被当成正式版安装
          prerelease: ${{ contains(github.ref_name, '-') }}
