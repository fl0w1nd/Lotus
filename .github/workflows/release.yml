name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff 需要完整提交历史

      # 按 mise.toml 安装固定版本的 Node 与 pnpm
      - uses: jdx/mise-action@v5

      - run: mise run install

      - run: mise run lint

      # package 任务会先构建,再打包 dist.zip 并校验哪吒面板
      # 「前端管理」(v2.5.0+) 要求的结构(全部位于 dist/ 下,含 index.html)
      - run: mise run package
        env:
          LOTUS_VERSION: ${{ github.ref_name }}

      # 按 conventional commits 自动分组生成本次 tag 的更新说明
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist.zip
          body_path: CHANGELOG.md
          # 带连字符的 tag(如 v1.2.0-rc.1)标为预发布,
          # 面板「前端管理」会明确标记,避免被当成正式版安装
          prerelease: ${{ contains(github.ref_name, '-') }}
